[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-parallel"
version = "0.1.8"
description = "Thread/process pool parallel execution utilities"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "tqdm",
]

[project.optional-dependencies]
# Bare install is the full package; [all] resolves dev+docs for
# ecosystem-wide `pip install scitex-*[all]` uniformity (PS-214/215).
all = [
    "scitex-parallel[dev,docs]",
]

dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "scitex-dev>=0.11.7",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-parallel"
Repository = "https://github.com/ywatanabe1989/scitex-parallel"
Issues = "https://github.com/ywatanabe1989/scitex-parallel/issues"
Documentation = "https://scitex-parallel.readthedocs.io"

[project.entry-points."scitex_dev.docs"]
scitex-parallel = "scitex_parallel"

[project.entry-points."scitex_dev.skills"]
scitex-parallel = "scitex_parallel"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_parallel"]

[tool.coverage.run]
parallel = true
source = ["scitex_parallel"]
concurrency = ["multiprocessing", "thread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast subprocess happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows against real subsystems (gate with RUN_E2E=1)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

dependencies = [
    "scitex-dev>=0.17.8",
]
